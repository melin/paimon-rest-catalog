# Spark 侧连接 Paimon REST Catalog 的会话配置模板。
#
# 放到 Spark 发行版的 conf/ 目录下，或作为 spark-submit --properties-file 传入。
#
# 用 spark-sql / spark-submit 时，Paimon 的 bundle 要能被找到：
#   --jars /path/to/paimon-spark-3.5_2.12-2.0.0.jar
# 本仓库把它的坐标钉在 pom.xml 的 <paimon.version>；对应的 jar 在
# ~/.m2/repository/org/apache/paimon/paimon-spark-3.5_2.12/2.0.0/
#
# 完整的 SQL 示例与报错对照见 docs/spark-paimon-rest-e2e.md。

# ---------------------------------------------------------------------------
# 扩展
# ---------------------------------------------------------------------------
# 两个都必须装，顺序不敏感但建议本项目扩展在前。
#
# 缺 org.apache.paimon.spark.extensions.PaimonSparkSessionExtensions 时，
# Paimon 的 SparkCatalog 会在初始化阶段直接拒绝工作；
# 缺本项目的扩展时，管理语句（主体、角色、授权）不会被识别。
#
# 注意 spark.sql.extensions 只在**建会话那一刻**生效，
# 会话建好之后再 spark.conf.set 是不起作用的。
spark.sql.extensions=com.example.paimonrest.spark.ManagementSparkExtensions,org.apache.paimon.spark.extensions.PaimonSparkSessionExtensions

# ---------------------------------------------------------------------------
# Paimon catalog
# ---------------------------------------------------------------------------
spark.sql.catalog.paimon=org.apache.paimon.spark.SparkCatalog
spark.sql.catalog.paimon.metastore=rest

# 服务端地址。**不要**带 /v1 后缀，客户端会自己拼路径。
spark.sql.catalog.paimon.uri=http://paimon-rest-server:8080

# 填的是 catalog 的 prefix，不是文件路径。
# 客户端启动时先请求 GET /v1/config?warehouse=<该值>，服务端用仓库名换回 prefix，
# 之后所有请求路径都以它开头。服务端的 paimon.rest.default-prefix 也叫 paimon，
# 两侧同名才对得上。
spark.sql.catalog.paimon.warehouse=paimon

# 鉴权。服务端开了 paimon.rest.auth.enabled 时必填。
# token.provider=bear 表示用固定的 Bearer 令牌（生产应换成动态凭证下发）。
spark.sql.catalog.paimon.token.provider=bear
spark.sql.catalog.paimon.token=CHANGE_ME_REST_TOKEN

# ---------------------------------------------------------------------------
# 本地/单机运行时的补充项
# ---------------------------------------------------------------------------
# 单机模式下没有外部依赖，关掉 UI 与并发，避免占资源与端口：
#spark.ui.enabled=false
#spark.driver.host=127.0.0.1
#spark.driver.bindAddress=127.0.0.1
#spark.sql.shuffle.partitions=1

# ---------------------------------------------------------------------------
# 不要设的一项
# ---------------------------------------------------------------------------
# 不要为了「让 paimon 能被识别为数据源」而往下面这个配置里加 paimon：
#   spark.sql.sources.useV1SourceList=...,paimon
# 它会让 CREATE TABLE ... USING paimon 走 V1 数据源路径而失败，
# 报错仍然是 "paimon is not a valid Spark SQL Data Source"，
# 与真正的原因（漏了 catalog 前缀）完全不同。
